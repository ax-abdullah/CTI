apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cti.fullname" . }}-config
  labels:
    {{- include "cti.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # The app reads REDIS_HOST/REDIS_PORT; KEDA's redis scaler wants a single
  # host:port and resolves it from the TARGET deployment's env, so it is
  # derived here rather than asking operators to keep two values in step.
  REDIS_ADDRESS: {{ printf "%s:%s" .Values.config.REDIS_HOST .Values.config.REDIS_PORT | quote }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
Convenience only. For anything real, set `secrets.existingSecret` and manage
the values with an external secrets operator or sealed-secrets — values passed
to Helm end up in the release history in plain text.

CREDS_KEY in particular is the master key for every stored AMI/CRM credential:
change it and every encrypted secret in the registry becomes undecryptable.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cti.fullname" . }}-secrets
  labels:
    {{- include "cti.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}

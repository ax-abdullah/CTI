{{- /*
One image, three workloads. They differ only in CTI_ROLE, resources and how
they drain — so they are generated from one template rather than three
near-identical files that would drift apart.
*/ -}}
{{- $roles := list "api" "connector" "worker" -}}
{{- range $role := $roles -}}
{{- $cfg := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cti.fullname" $ }}-{{ $role }}
  labels:
    {{- include "cti.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- /* When an autoscaler owns replicas, omitting the field stops every
         `helm upgrade` from resetting the count back to the chart default. */}}
  {{- if not $cfg.autoscaling.enabled }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cti.selectorLabels" (dict "root" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cti.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
      annotations:
        # Roll pods when config or secrets change; without this a values-only
        # upgrade updates the ConfigMap but leaves pods running the old copy.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-secret.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "cti.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- if $.Values.topologySpreadEnabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cti.selectorLabels" (dict "root" $ "role" $role) | nindent 14 }}
      {{- end }}
      containers:
        - name: cti
          image: {{ include "cti.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "cti.envVars" $ | nindent 12 }}
            - name: CTI_ROLE
              value: {{ $role | quote }}
          envFrom:
            {{- include "cti.envFrom" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $.Values.config.PORT | int }}
          {{- /* /health/live is the only endpoint with no external dependency,
                 so it cannot fail for a reason a restart would not fix.
                 /health/ready gates on Postgres + Redis and is the only one
                 that returns a failing status code.
                 NOTE: plain /health is NOT a probe target — it reports the
                 connections this replica owns (empty is normal on api) and
                 always returns 200 regardless. */}}
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                {{- if eq $role "connector" }}
                # Sleep lets the endpoint removal propagate; the app's own
                # shutdown hook then releases ownership leases, so a peer takes
                # the PBX over in about one sweep instead of waiting out the
                # lease TTL.
                {{- else if eq $role "api" }}
                # Sleep first so the load balancer stops sending new requests
                # before the process starts refusing them; agent WebSockets are
                # then closed with 1012 ("Service Restart") so clients reconnect
                # to another replica rather than treating it as a hard failure.
                {{- else }}
                # Brief pause, then BullMQ drains in-flight jobs within the
                # grace period rather than abandoning a CRM write mid-flight.
                {{- end }}
                command: ["/bin/sh", "-c", "sleep {{ $cfg.preStopSleepSeconds }}"]
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

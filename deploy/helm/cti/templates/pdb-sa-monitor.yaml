{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cti.serviceAccountName" . }}
  labels:
    {{- include "cti.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- /*
A PDB per role, because they fail differently: evicting every connector at
once orphans the PBXs until leases expire, and evicting every api pod drops
every agent socket simultaneously.
*/ -}}
{{- range $role := list "api" "connector" "worker" }}
{{- $cfg := index $.Values $role }}
{{- if $cfg.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cti.fullname" $ }}-{{ $role }}
  labels:
    {{- include "cti.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cti.selectorLabels" (dict "root" $ "role" $role) | nindent 6 }}
{{- end }}
{{- end }}

{{- if .Values.serviceMonitor.enabled }}
{{- /*
Scrape every role: `worker` and `connector` expose the gauges that matter most
(queue depth, leases held, active calls) even though they serve no API.
*/ -}}
{{- range $role := list "api" "connector" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cti.fullname" $ }}-{{ $role }}
  labels:
    {{- include "cti.labels" $ | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cti.selectorLabels" (dict "root" $ "role" $role) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
